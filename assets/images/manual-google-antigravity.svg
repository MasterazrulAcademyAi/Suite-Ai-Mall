<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%" style="background:#070b19; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24"/>
      <stop offset="35%" stop-color="#070c1e"/>
      <stop offset="70%" stop-color="#0d1b3e"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="goldGlow" cx="50%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffb703" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Gradients -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>

    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00bbf9"/>
      <stop offset="100%" stop-color="#4361ee"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141e3a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e1529" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="50%" stop-color="#fb8500"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="logoClip">
      <circle cx="65" cy="48" r="26"/>
    </clipPath>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="1200" fill="url(#bgGrad)"/>
  <rect width="800" height="1200" fill="url(#cyanGlow)"/>
  <rect width="800" height="1200" fill="url(#purpleGlow)"/>
  <rect width="800" height="1200" fill="url(#goldGlow)"/>

  <!-- Brand Emblem Badge Top Left -->
  <g filter="url(#dropShadow)">
    <circle cx="65" cy="48" r="28" fill="#000000" stroke="#ffb703" stroke-width="2"/>
    <image href="logo.jpg" x="39" y="22" width="52" height="52" clip-path="url(#logoClip)"/>
  </g>

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.08" stroke="#00f5d4" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="700" x2="800" y2="700"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
    <line x1="0" y1="900" x2="800" y2="900"/>
    <line x1="0" y1="1000" x2="800" y2="1000"/>
    <line x1="0" y1="1100" x2="800" y2="1100"/>

    <line x1="100" y1="0" x2="100" y2="1200"/>
    <line x1="200" y1="0" x2="200" y2="1200"/>
    <line x1="300" y1="0" x2="300" y2="1200"/>
    <line x1="400" y1="0" x2="400" y2="1200"/>
    <line x1="500" y1="0" x2="500" y2="1200"/>
    <line x1="600" y1="0" x2="600" y2="1200"/>
    <line x1="700" y1="0" x2="700" y2="1200"/>
  </g>

  <!-- TOP HEADER TAG -->
  <g transform="translate(400, 45)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="url(#badgeGrad)" filter="url(#dropShadow)"/>
    <text x="0" y="5" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="2">⚡ PANDUAN REVOLUSI AI 2026</text>
  </g>

  <!-- MAIN HEADINGS -->
  <text x="400" y="115" fill="url(#goldText)" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="1">
    PANDUAN LENGKAP ZERO TO HERO
  </text>
  
  <text x="400" y="175" fill="#ffffff" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="-1" filter="url(#dropShadow)">
    GOOGLE <tspan fill="#00f5d4">ANTIGRAVITY</tspan>
  </text>
  
  <text x="400" y="215" fill="#94a3b8" font-size="18" font-weight="600" text-anchor="middle">
    Bina Sistem, Laman Web &amp; Aplikasi dengan AI Tanpa Perlu Coding!
  </text>

  <!-- HIGHLIGHT RIBBONS -->
  <g transform="translate(400, 255)">
    <g transform="translate(-240, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="0" y="5" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">✓ Sistem Siap Guna</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
      <text x="0" y="5" fill="#4ade80" font-size="12" font-weight="700" text-anchor="middle">✓ Tiada Kod Rumit</text>
    </g>
    <g transform="translate(240, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
      <text x="0" y="5" fill="#f472b6" font-size="12" font-weight="700" text-anchor="middle">✓ Siap Template Prompt</text>
    </g>
  </g>

  <!-- CENTER VISUAL ILLUSTRATION: LAPTOP & ANTIGRAVITY ORB -->
  <g transform="translate(400, 420)" filter="url(#dropShadow)">
    <!-- Glowing Ring / Halo -->
    <circle cx="0" cy="-20" r="140" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
    <circle cx="0" cy="-20" r="160" fill="none" stroke="#7928ca" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4"/>

    <!-- Antigravity Stylized Floating Icon Behind Screen -->
    <g transform="translate(0, -90) scale(1.1)">
      <!-- Antigravity Triangle / Delta symbol -->
      <path d="M 0,-50 L 45,30 L -45,30 Z" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="0" cy="-5" r="16" fill="url(#btnGrad)"/>
      <circle cx="0" cy="-5" r="30" fill="none" stroke="#00f5d4" stroke-width="2" opacity="0.7"/>
    </g>

    <!-- Laptop Base & Screen Mockup -->
    <!-- Screen Outer Frame -->
    <rect x="-190" y="-80" width="380" height="225" rx="14" fill="#0f172a" stroke="#334155" stroke-width="3" filter="url(#dropShadow)"/>
    <!-- Screen Inner Display -->
    <rect x="-180" y="-70" width="360" height="205" rx="8" fill="#030712"/>
    
    <!-- Code Editor UI Simulation inside Laptop -->
    <rect x="-180" y="-70" width="360" height="24" fill="#111827"/>
    <circle cx="-168" cy="-58" r="4" fill="#ef4444"/>
    <circle cx="-156" cy="-58" r="4" fill="#f59e0b"/>
    <circle cx="-144" cy="-58" r="4" fill="#10b981"/>
    <text x="0" y="-53" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">Google Antigravity Agent Studio • System Dashboard</text>
    
    <!-- Left Panel Code Lines -->
    <rect x="-170" y="-35" width="150" height="150" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="-160" y="-15" fill="#38bdf8" font-size="11" font-weight="700">// Prompt Kejuruteraan</text>
    <text x="-160" y="5" fill="#f43f5e" font-size="10">agent.createSystem({</text>
    <text x="-150" y="22" fill="#a78bfa" font-size="9">  role: "Lead Architect",</text>
    <text x="-150" y="38" fill="#34d399" font-size="9">  autoDeploy: true,</text>
    <text x="-150" y="54" fill="#fbbf24" font-size="9">  database: "InstantCloud",</text>
    <text x="-150" y="70" fill="#94a3b8" font-size="9">  exportFormat: "Web+APK"</text>
    <text x="-160" y="88" fill="#f43f5e" font-size="10">});</text>
    <rect x="-160" y="98" width="130" height="5" rx="2" fill="#22c55e" opacity="0.8"/>

    <!-- Right Panel Live App Preview -->
    <rect x="-5" y="-35" width="175" height="150" rx="6" fill="#0f172a" stroke="#00f5d4" stroke-width="1.2"/>
    <rect x="5" y="-25" width="155" height="22" rx="4" fill="url(#cyanBlueGrad)"/>
    <text x="82" y="-10" fill="#040d1a" font-size="10" font-weight="800" text-anchor="middle">🚀 SISTEM SIAP &amp; LIVE</text>
    
    <!-- Mini UI Cards on Right -->
    <rect x="5" y="4" width="72" height="42" rx="4" fill="#1e293b"/>
    <text x="12" y="20" fill="#94a3b8" font-size="8">Users Active</text>
    <text x="12" y="36" fill="#00f5d4" font-size="13" font-weight="800">1,480+</text>

    <rect x="87" y="4" width="73" height="42" rx="4" fill="#1e293b"/>
    <text x="94" y="20" fill="#94a3b8" font-size="8">Daily Sales</text>
    <text x="94" y="36" fill="#4ade80" font-size="13" font-weight="800">RM 5.2k</text>

    <!-- Mini chart bar -->
    <rect x="5" y="54" width="155" height="52" rx="4" fill="#1e293b"/>
    <text x="12" y="70" fill="#cbd5e1" font-size="9" font-weight="700">Analytics AI Realtime</text>
    <path d="M 15 95 Q 45 75 75 85 T 145 70" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="145" cy="70" r="3.5" fill="#f43f5e"/>

    <!-- Laptop Keyboard Deck / Lower Base -->
    <path d="M -230,145 L 230,145 L 205,170 L -205,170 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="-50" y="148" width="100" height="6" rx="3" fill="#0f172a"/>

    <!-- Floating Badges Around Laptop -->
    <!-- Floating Tag 1: APK / Web -->
    <g transform="translate(-190, 20)">
      <rect x="-45" y="-18" width="90" height="36" rx="18" fill="#1e293b" stroke="#00f5d4" stroke-width="2" filter="url(#dropShadow)"/>
      <text x="0" y="4" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">📱 APK &amp; WEB</text>
    </g>

    <!-- Floating Tag 2: NO CODING -->
    <g transform="translate(195, -20)">
      <rect x="-55" y="-18" width="110" height="36" rx="18" fill="#1e293b" stroke="#ffb703" stroke-width="2" filter="url(#dropShadow)"/>
      <text x="0" y="4" fill="#ffb703" font-size="11" font-weight="800" text-anchor="middle">🔥 NO CODING!</text>
    </g>

    <!-- Floating Tag 3: 8 MODUL LENGKAP -->
    <g transform="translate(180, 95)">
      <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#1e293b" stroke="#f43f5e" stroke-width="2" filter="url(#dropShadow)"/>
      <text x="0" y="4" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">📚 8 FAIL MODUL</text>
    </g>
  </g>

  <!-- 6 CORE MODULES SECTION -->
  <g transform="translate(400, 625)">
    <text x="0" y="0" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="1">
      APA YANG ANDA AKAN KUASAI?
    </text>
    <rect x="-40" y="10" width="80" height="3" rx="1.5" fill="#00f5d4"/>
  </g>

  <!-- Grid of 6 Modules -->
  <g transform="translate(50, 660)">
    <!-- Box 1 -->
    <g transform="translate(0, 0)">
      <rect width="335" height="68" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="32" cy="34" r="18" fill="#0284c7" opacity="0.2"/>
      <text x="32" y="40" fill="#38bdf8" font-size="16" font-weight="900" text-anchor="middle">01</text>
      <text x="65" y="27" fill="#ffffff" font-size="13" font-weight="700">Setup Workspace &amp; Tool</text>
      <text x="65" y="47" fill="#94a3b8" font-size="11">Persediaan pantas &amp; konfigurasi asas AI</text>
    </g>

    <!-- Box 2 -->
    <g transform="translate(365, 0)">
      <rect width="335" height="68" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="32" cy="34" r="18" fill="#8b5cf6" opacity="0.2"/>
      <text x="32" y="40" fill="#a78bfa" font-size="16" font-weight="900" text-anchor="middle">02</text>
      <text x="65" y="27" fill="#ffffff" font-size="13" font-weight="700">Prompt Engineering Khas</text>
      <text x="65" y="47" fill="#94a3b8" font-size="11">Formula arahan tepat hasilkan sistem tepat</text>
    </g>

    <!-- Box 3 -->
    <g transform="translate(0, 78)">
      <rect width="335" height="68" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="32" cy="34" r="18" fill="#059669" opacity="0.2"/>
      <text x="32" y="40" fill="#34d399" font-size="16" font-weight="900" text-anchor="middle">03</text>
      <text x="65" y="27" fill="#ffffff" font-size="13" font-weight="700">Bina Web App &amp; Dashboard</text>
      <text x="65" y="47" fill="#94a3b8" font-size="11">Paparan interaktif moden &amp; responsif</text>
    </g>

    <!-- Box 4 -->
    <g transform="translate(365, 78)">
      <rect width="335" height="68" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="32" cy="34" r="18" fill="#d97706" opacity="0.2"/>
      <text x="32" y="40" fill="#fbbf24" font-size="16" font-weight="900" text-anchor="middle">04</text>
      <text x="65" y="27" fill="#ffffff" font-size="13" font-weight="700">Template Siap Guna</text>
      <text x="65" y="47" fill="#94a3b8" font-size="11">Salin &amp; tampal untuk jimat puluhan jam</text>
    </g>

    <!-- Box 5 -->
    <g transform="translate(0, 156)">
      <rect width="335" height="68" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="32" cy="34" r="18" fill="#e11d48" opacity="0.2"/>
      <text x="32" y="40" fill="#fb7185" font-size="16" font-weight="900" text-anchor="middle">05</text>
      <text x="65" y="27" fill="#ffffff" font-size="13" font-weight="700">Database &amp; Pengurusan Data</text>
      <text x="65" y="47" fill="#94a3b8" font-size="11">Simpan rekod jualan, borang &amp; pengguna</text>
    </g>

    <!-- Box 6 -->
    <g transform="translate(365, 156)">
      <rect width="335" height="68" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="32" cy="34" r="18" fill="#0891b2" opacity="0.2"/>
      <text x="32" y="40" fill="#22d3ee" font-size="16" font-weight="900" text-anchor="middle">06</text>
      <text x="65" y="27" fill="#ffffff" font-size="13" font-weight="700">Eksport Jadi Aplikasi (APK/Web)</text>
      <text x="65" y="47" fill="#94a3b8" font-size="11">Pasang ke telefon pintar atau buka di web</text>
    </g>
  </g>

  <!-- BONUS SECTION -->
  <g transform="translate(50, 920)">
    <rect width="700" height="85" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" filter="url(#dropShadow)"/>
    <!-- Gift Icon Graphic -->
    <g transform="translate(45, 42)">
      <rect x="-22" y="-18" width="44" height="36" rx="4" fill="#f43f5e"/>
      <rect x="-24" y="-22" width="48" height="10" rx="3" fill="#fb7185"/>
      <line x1="0" y1="-22" x2="0" y2="18" stroke="#fef08a" stroke-width="5"/>
      <line x1="-22" y1="-3" x2="22" y2="-3" stroke="#fef08a" stroke-width="5"/>
      <!-- Ribbon bow -->
      <path d="M 0,-22 C -12,-36 -25,-25 0,-22 Z" fill="#fef08a"/>
      <path d="M 0,-22 C 12,-36 25,-25 0,-22 Z" fill="#fef08a"/>
    </g>
    <text x="85" y="32" fill="#fef08a" font-size="14" font-weight="900" letter-spacing="1">PERCUMA! BONUS EKSKLUSIF</text>
    <text x="85" y="55" fill="#ffffff" font-size="16" font-weight="800">1 Sesi Kelas Online Google Antigravity (Live Coaching)</text>
    <text x="85" y="73" fill="#a5b4fc" font-size="12">Belajar secara langsung, soal jawab &amp; terus siapkan sistem pertama anda!</text>
  </g>

  <!-- PRICE AND CTA SECTION -->
  <g transform="translate(50, 1030)">
    <!-- Price Card -->
    <rect width="700" height="120" rx="16" fill="#0b1329" stroke="#ffb703" stroke-width="2" filter="url(#dropShadow)"/>

    <!-- Left: Price details -->
    <g transform="translate(40, 30)">
      <text x="0" y="10" fill="#94a3b8" font-size="13" font-weight="700">HARGA PROMOSI PENGENALAN:</text>
      <text x="0" y="55" fill="url(#goldText)" font-size="46" font-weight="900">RM 29<tspan font-size="24">.90</tspan></text>
      <text x="175" y="45" fill="#64748b" font-size="16" font-weight="700" text-decoration="line-through">RM 89.00</text>
      <text x="0" y="75" fill="#4ade80" font-size="12" font-weight="700">⚡ Akses Seumur Hidup + Free Update</text>
    </g>

    <!-- Right: CTA Button -->
    <g transform="translate(420, 32)">
      <rect width="250" height="56" rx="28" fill="url(#btnGrad)" filter="url(#dropShadow)"/>
      <text x="125" y="35" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="0.5">DAPATKAN SEKARANG ➜</text>
    </g>
  </g>

  <!-- FOOTER AUDIENCE BAR -->
  <g transform="translate(400, 1180)">
    <text x="0" y="0" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle">
      Sesuai untuk: Usahawan • Guru • Content Creator • Pelajar • Peminat AI Tanpa Coding
    </text>
  </g>
</svg>