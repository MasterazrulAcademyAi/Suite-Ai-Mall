<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Eksport Poster Manual Google Antigravity</title>
  <style>
    body {
      background: #0b0f19;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }
    .card {
      background: #141b2d;
      border: 1px solid #2a344d;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    img {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,242,254,0.2);
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #040d1a;
      font-weight: 800;
      text-decoration: none;
      border-radius: 12px;
      cursor: pointer;
      border: none;
      font-size: 16px;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: scale(1.05);
      background: #00f2fe;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin-top:0; color:#00f2fe;">Poster Manual Google Antigravity</h2>
    <p style="color:#94a3b8; font-size:14px;">Format vektor resolusi tinggi sedia ada. Anda boleh muat turun sebagai imej PNG berkualiti tinggi untuk pos ke TikTok, WhatsApp atau Facebook.</p>
    
    <div style="margin: 20px 0;">
      <img id="previewImg" src="assets/images/manual-google-antigravity.svg" alt="Manual Google Antigravity Poster">
    </div>

    <button id="downloadBtn" class="btn" onclick="exportPNG()">⬇ Muat Turun sebagai PNG (800x1200)</button>
    <canvas id="exportCanvas" width="800" height="1200" style="display:none;"></canvas>
  </div>

  <script>
    function exportPNG() {
      const canvas = document.getElementById('exportCanvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        ctx.drawImage(img, 0, 0, 800, 1200);
        const a = document.createElement('a');
        a.download = 'manual-google-antigravity-poster.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      img.src = 'assets/images/manual-google-antigravity.svg';
    }
  </script>
</body>
</html>
